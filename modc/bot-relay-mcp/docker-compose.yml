services:
  relay:
    image: ghcr.io/fearjet44/bot-relay-mcp:2.0.0
    user: "1000:1000"
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      PORT: "8080"
      ADMIN_PORT: "8081"
      DB_PATH: /data/relay.db
      ADMIN_GATEWAY_KEY: ${APP_GATEWAY_KEY:-}
      ADMIN_PASSWORD: ${APP_PASSWORD:-}
      ENCRYPTION_KEY: ${APP_SEED:-}
      PUBLIC_URL: http://${SERVER_IP:-localhost}:8390
      WEBHOOK_ALLOW_HTTP: private
    volumes:
      - ${APP_DATA_DIR:-.}/data:/data
    ports:
      - "8390:8080"
      - "8391:8081"
