services:
  relay:
    image: ghcr.io/fearjet44/bot-relay-mcp:2.0.0
    user: "1000:1000"
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      PORT: "8080"
      ADMIN_PORT: "8081"
      DB_PATH: /data/relay.db
      ADMIN_GATEWAY_KEY: ${APP_GATEWAY_KEY:-}
      ADMIN_PASSWORD: ${APP_PASSWORD:-}
      ENCRYPTION_KEY: ${APP_SEED:-}
      PUBLIC_URL: http://${SERVER_IP:-localhost}:8390
      WEBHOOK_ALLOW_HTTP: private
    volumes:
      - ${APP_DATA_DIR:-.}/data:/data
    ports:
      - "8390:8080"
      - "8391:8081"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    healthcheck:
      # CMD-SHELL string form: podman-compose 1.0.x mangles the ["CMD", ...] array form.
      test: ["CMD-SHELL", "node scripts/healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
