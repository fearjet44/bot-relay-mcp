# Works with rootless Podman (`podman compose up -d` / `podman-compose up -d`).
# No published ports: the relay is reachable only on the compose network, and
# cloudflared carries public traffic to http://relay:8080.
name: bot-relay

services:
  relay:
    build:
      context: .
    image: localhost/bot-relay-mcp:latest
    restart: unless-stopped
    environment:
      BOTS: ${BOTS:?BOTS must be set in .env}
      VIEWER_TOKEN_SHA256: ${VIEWER_TOKEN_SHA256:-}
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:-relay.justinhagemeier.com}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-32768}
      MAX_SUBJECT_CHARS: ${MAX_SUBJECT_CHARS:-200}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
    volumes:
      - relay-data:/data:Z
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    healthcheck:
      # CMD-SHELL string form: podman-compose 1.0.x mangles the ["CMD", ...] array form.
      test: ["CMD-SHELL", "node scripts/healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Remove this service if cloudflared is managed outside this stack (e.g. by
  # Omarchy); then point that tunnel's public hostname at the relay container.
  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-docker.io/cloudflare/cloudflared:latest}
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    # TUNNEL_TOKEN is read from .env via env_file (not `environment:`) so that
    # podman-compose, which echoes each `podman run` command, never prints it.
    env_file:
      - .env
    depends_on:
      - relay
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges

volumes:
  relay-data:
