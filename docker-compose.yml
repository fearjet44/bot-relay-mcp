# From a git checkout, build locally. Compose otherwise pulls :latest before it builds,
# and ghcr.io/fearjet44/bot-relay-mcp:latest does not exist until the first release.
#   docker compose up -d --build
#   podman compose up -d --build
# pull_policy: build makes a plain `up` build too, on implementations that honor it.
# No .env file or Cloudflare Tunnel is required.
#
# Ports:
#   - 8390 -> Bot API (/mcp, /register, /events, /me, /healthz)
#   - 8391 -> Web Admin Dashboard (manage bots, invite codes, webhooks, logs)
#
# Optional Cloudflare Tunnel sidecar:
#   docker compose --profile cloudflare up -d --build
name: bot-relay

services:
  relay:
    build:
      context: .
    image: ${RELAY_IMAGE:-ghcr.io/fearjet44/bot-relay-mcp:latest}
    # :latest is always pulled when pull_policy is omitted, even if `build` is set.
    pull_policy: build
    user: "1000:1000"
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      PORT: "8080"
      ADMIN_PORT: "8081"
      DB_PATH: /data/relay.db
      PUBLIC_URL: ${PUBLIC_URL:-}
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_TOKEN_SHA256: ${ADMIN_TOKEN_SHA256:-}
      VIEWER_TOKEN_SHA256: ${VIEWER_TOKEN_SHA256:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      BOOTSTRAP_INVITE_CODE: ${BOOTSTRAP_INVITE_CODE:-}
      BOOTSTRAP_INVITE_USES: ${BOOTSTRAP_INVITE_USES:-}
      BOOTSTRAP_INVITE_TTL: ${BOOTSTRAP_INVITE_TTL:-}
      BOOTSTRAP_INVITE_BOT: ${BOOTSTRAP_INVITE_BOT:-}
      BOTS: ${BOTS:-}
      WEBHOOK_ALLOW_HTTP: ${WEBHOOK_ALLOW_HTTP:-private}
      WEBHOOK_ALLOW_LOOPBACK: ${WEBHOOK_ALLOW_LOOPBACK:-false}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-32768}
      MAX_SUBJECT_CHARS: ${MAX_SUBJECT_CHARS:-200}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      REGISTER_RATE_LIMIT_PER_MINUTE: ${REGISTER_RATE_LIMIT_PER_MINUTE:-10}
    ports:
      - "${RELAY_PORT:-8390}:8080"
      - "${ADMIN_HOST_PORT:-8391}:8081"
    volumes:
      - relay-data:/data:Z
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    healthcheck:
      # CMD-SHELL string form: podman-compose 1.0.x mangles the ["CMD", ...] array form.
      test: ["CMD-SHELL", "node scripts/healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional: start with `docker compose --profile cloudflare up -d` if exposing over Cloudflare Tunnel.
  cloudflared:
    profiles: ["cloudflare"]
    image: ${CLOUDFLARED_IMAGE:-docker.io/cloudflare/cloudflared:latest}
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - relay
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges

volumes:
  relay-data:
